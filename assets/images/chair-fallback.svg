<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Illustration of a barber chair in side view</title>
  <defs>
    <radialGradient id="bg" cx=".6" cy=".3" r=".8"><stop offset="0" stop-color="#2a2825"/><stop offset="1" stop-color="#000"/></radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d6a63"/><stop offset=".4" stop-color="#f6f1e4"/><stop offset="1" stop-color="#4a4843"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2420"/><stop offset="1" stop-color="#0d0a09"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="800" height="640" fill="url(#bg)"/>
  <ellipse cx="400" cy="560" rx="260" ry="26" fill="#000" filter="url(#blur)" opacity=".9"/>
  <ellipse cx="400" cy="552" rx="230" ry="16" fill="none" stroke="#f1ebdd" stroke-opacity=".35"/>
  <!-- base and column -->
  <ellipse cx="400" cy="540" rx="150" ry="22" fill="url(#chrome)"/>
  <rect x="368" y="448" width="64" height="86" rx="10" fill="url(#chrome)"/>
  <rect x="384" y="390" width="32" height="64" fill="url(#chrome)"/>
  <!-- footrest -->
  <g transform="rotate(24 430 440)"><rect x="430" y="440" width="150" height="14" rx="6" fill="url(#chrome)"/></g>
  <g transform="rotate(-18 560 480)"><rect x="540" y="480" width="150" height="22" rx="8" fill="url(#leather)" stroke="#f1ebdd" stroke-opacity=".4"/></g>
  <!-- backrest and headrest -->
  <g transform="rotate(-11 290 380)">
    <rect x="232" y="150" width="96" height="236" rx="44" fill="url(#leather)" stroke="#f1ebdd" stroke-opacity=".4" stroke-width="2"/>
    <rect x="250" y="72" width="112" height="82" rx="34" fill="url(#leather)" stroke="#f1ebdd" stroke-opacity=".4" stroke-width="2"/>
    <rect x="296" y="150" width="6" height="22" fill="url(#chrome)"/><rect x="316" y="150" width="6" height="22" fill="url(#chrome)"/>
  </g>
  <!-- seat and arm -->
  <rect x="270" y="360" width="290" height="62" rx="30" fill="url(#leather)" stroke="#f1ebdd" stroke-opacity=".4" stroke-width="2"/>
  <rect x="470" y="318" width="10" height="46" fill="url(#chrome)"/>
  <rect x="330" y="296" width="190" height="24" rx="12" fill="url(#leather)" stroke="#f1ebdd" stroke-opacity=".4" stroke-width="2"/>
</svg>
